name: VoiceNotes Android — BASE v0.2.2 VERIFIED

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download and verify official multilingual Whisper BASE model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_ARCHIVE="$RUNNER_TEMP/sherpa-onnx-whisper-base.tar.bz2"
          MODEL_DIR="$RUNNER_TEMP/whisper-base-model"
          ASSET_ROOT="app/src/main/assets"
          ASSET_DIR="$ASSET_ROOT/models"

          # Remove any old tiny/base assets before staging the chosen model.
          rm -rf "$ASSET_ROOT" "$MODEL_DIR"
          mkdir -p "$MODEL_DIR" "$ASSET_DIR"

          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.tar.bz2 \
            --output "$MODEL_ARCHIVE"
          test -s "$MODEL_ARCHIVE"
          tar -xjf "$MODEL_ARCHIVE" -C "$MODEL_DIR"

          find_model() { find "$MODEL_DIR" -type f -name "$1" -print -quit; }
          ENCODER="$(find_model base-encoder.int8.onnx)"
          DECODER="$(find_model base-decoder.int8.onnx)"
          TOKENS="$(find_model base-tokens.txt)"
          [[ -n "$ENCODER" ]] || { echo 'FATAL: official archive missing base-encoder.int8.onnx'; find "$MODEL_DIR" -type f; exit 1; }
          [[ -n "$DECODER" ]] || { echo 'FATAL: official archive missing base-decoder.int8.onnx'; find "$MODEL_DIR" -type f; exit 1; }
          [[ -n "$TOKENS" ]] || { echo 'FATAL: official archive missing base-tokens.txt'; find "$MODEL_DIR" -type f; exit 1; }

          # Guard against a tiny model being renamed to look like base.
          ENCODER_BYTES=$(wc -c < "$ENCODER")
          DECODER_BYTES=$(wc -c < "$DECODER")
          TOKENS_BYTES=$(wc -c < "$TOKENS")
          echo "BASE encoder bytes=$ENCODER_BYTES decoder bytes=$DECODER_BYTES tokens bytes=$TOKENS_BYTES"
          (( ENCODER_BYTES > 20000000 )) || { echo 'FATAL: encoder is too small to be Whisper base'; exit 1; }
          (( DECODER_BYTES > 100000000 )) || { echo 'FATAL: decoder is too small to be Whisper base INT8'; exit 1; }
          (( TOKENS_BYTES > 500000 )) || { echo 'FATAL: tokenizer is unexpectedly small'; exit 1; }

          cp "$ENCODER" "$ASSET_DIR/base-encoder.int8.onnx"
          cp "$DECODER" "$ASSET_DIR/base-decoder.int8.onnx"
          cp "$TOKENS" "$ASSET_DIR/base-tokens.txt"
          printf '%s\n' 'whisper-base-int8-v0.2.2' > "$ASSET_DIR/model-version.txt"

          # Assert staged directory is exactly the model expected by source code.
          test "$(find "$ASSET_DIR" -maxdepth 1 -type f | wc -l)" -eq 4
          test ! -e "$ASSET_DIR/tiny-encoder.int8.onnx"
          test ! -e "$ASSET_DIR/tiny-decoder.int8.onnx"
          test ! -e "$ASSET_DIR/tiny-tokens.txt"
          ls -lh "$ASSET_DIR"

      - name: Verify source and model version agree
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionName = "0.2.2"' app/build.gradle.kts
          grep -Fq 'whisper-base-int8-v0.2.2' app/src/main/java/com/example/voicenotes/MainActivity.kt
          grep -Fq 'models/base-encoder.int8.onnx' app/src/main/java/com/example/voicenotes/MainActivity.kt
          grep -Fq 'models/base-tokens.txt' app/src/main/java/com/example/voicenotes/MainActivity.kt
          if grep -Eq 'models/tiny-|tiny-tokens' app/src/main/java/com/example/voicenotes/MainActivity.kt; then
            echo 'FATAL: app source still references a tiny model'; exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify model files INSIDE the exact APK and reject stale builds
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          [[ -n "$APK" ]] || { echo 'FATAL: APK was not produced'; exit 1; }
          echo "APK=$APK"
          APK_BYTES=$(wc -c < "$APK")
          echo "APK bytes=$APK_BYTES"
          (( APK_BYTES > 120000000 )) || { echo 'FATAL: APK is too small to contain Whisper base INT8'; exit 1; }
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-entries.txt"
          for name in base-encoder.int8.onnx base-decoder.int8.onnx base-tokens.txt model-version.txt; do
            grep -Fxq "assets/models/$name" "$RUNNER_TEMP/apk-entries.txt" || {
              echo "FATAL: APK missing assets/models/$name";
              grep '^assets/models/' "$RUNNER_TEMP/apk-entries.txt" || true; exit 1;
            }
          done
          if grep -Eq '^assets/models/tiny(-|\.)' "$RUNNER_TEMP/apk-entries.txt"; then
            echo 'FATAL: tiny model assets found in APK'; grep '^assets/models/tiny' "$RUNNER_TEMP/apk-entries.txt"; exit 1
          fi
          APK_MARKER=$(unzip -p "$APK" assets/models/model-version.txt)
          [[ "$APK_MARKER" == 'whisper-base-int8-v0.2.2' ]] || { echo "FATAL: wrong model marker: $APK_MARKER"; exit 1; }
          DECODER_BYTES_IN_APK=$(unzip -p "$APK" assets/models/base-decoder.int8.onnx | wc -c)
          echo "APK base decoder bytes=$DECODER_BYTES_IN_APK"
          (( DECODER_BYTES_IN_APK > 100000000 )) || { echo 'FATAL: base decoder missing/truncated in APK'; exit 1; }
          sha256sum "$APK"

      - name: Upload verified Whisper BASE APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceNotes-APK-BASE-VERIFIED-v0.2.2
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
